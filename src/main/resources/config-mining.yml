# Reapwright Mining — experimental development defaults.
# Set enabled to true to enable mining bonus loot.
# Bonus rolls do not replace or modify vanilla block drops.
# Tools with Silk Touch never earn mining bonuses.
# Mining compatibility with WorldGuard is untested. Use at your own risk.
# WARNING: Block material alone cannot prove that a block was naturally generated.
# Player-placed and regenerated blocks of the same material can also qualify.
# Do not enable this on an economy server without additional provenance controls.
enabled: false

# Toggle bonus loot while keeping the Mining module enabled.
bonus-loot:
  enabled: true

# Independent chance rolls once per successfully mined configured block.
# Diamond and Netherite pickaxes are the only eligible tools.
eligible-tools:
  diamond: true
  netherite: true

# Multipliers apply to successful drop quantities. Fractions use randomized rounding.
# Fortune does not change the chance of a successful roll.
fortune-quantity-multipliers:
  I: 1.25
  II: 1.667
  III: 2.0

# Block types allowed in environment and named-world tables.
# A block needs at least one reward in its active table to give bonus loot.
enabled-blocks:
  - STONE
  - DEEPSLATE
  - GRANITE
  - DIORITE
  - ANDESITE
  - TUFF
  - CALCITE
  - DRIPSTONE_BLOCK
  - SMOOTH_BASALT
  - BASALT
  - BLACKSTONE
  - NETHERRACK
  - SULFUR
  - CINNABAR
  - SANDSTONE
  - RED_SANDSTONE
  - END_STONE
  - COAL_ORE
  - DEEPSLATE_COAL_ORE
  - IRON_ORE
  - DEEPSLATE_IRON_ORE
  - COPPER_ORE
  - DEEPSLATE_COPPER_ORE
  - GOLD_ORE
  - DEEPSLATE_GOLD_ORE
  - REDSTONE_ORE
  - DEEPSLATE_REDSTONE_ORE
  - LAPIS_ORE
  - DEEPSLATE_LAPIS_ORE
  - DIAMOND_ORE
  - DEEPSLATE_DIAMOND_ORE
  - EMERALD_ORE
  - DEEPSLATE_EMERALD_ORE
  - NETHER_GOLD_ORE
  - NETHER_QUARTZ_ORE

# Each item listed under a rock is rolled independently per qualifying break.
