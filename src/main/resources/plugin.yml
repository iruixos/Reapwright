name: Reapwright
version: '2.1.1'
main: com.iruixos.reapwright.ReapwrightPlugin
api-version: '26.3'
author: iruixos
folia-supported: false
softdepend: [WorldGuard, CoreProtect, Veinminer]
description: Near-vanilla crop harvesting, tree felling and optional mining bonus loot.
commands:
  reapwright:
    description: Reapwright administration
    usage: /reapwright reload | tree debug
permissions:
  reapwright.use:
    description: Allows harvesting with supported hoes
    default: true
  reapwright.treefeller:
    description: Allows opt-in Tree Feller harvesting
    default: true
  reapwright.mining:
    description: Allows bonus loot from configured rock mining when enabled
    default: true
  reapwright.admin:
    description: Allows reloading Reapwright configuration
    default: op
