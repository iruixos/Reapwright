# Right-click harvesting works on mature crops only.
allowed-tools:
  - DIAMOND_HOE
  - NETHERITE_HOE

# Only crops with an Ageable block state are supported.
enabled-crops:
  - WHEAT
  - CARROTS
  - POTATOES
  - BEETROOTS
  - NETHER_WART

# If a harvested crop does not drop a replantable item, use one from inventory.
use-inventory-for-replanting: true

# Harvested items are inserted into inventory; overflow is dropped at the crop.
insert-drops-into-inventory: true

# A successful harvest attempts to consume one durability point.
# Unbreaking reduces the probability of damage using vanilla's 1/(level+1) rule.
consume-durability: true

# Add 0..Fortune level bonus wheat/beetroot produce on successful harvest.
# Vanilla loot tables already boost seeds; these remain unchanged.
fortune-boost-produce: true

# Width and length of the square harvested by one right-click.
# 1 = 1 block, 2 = 2x2, 3 = 3x3, etc. Allowed range: 1..9.
# Only mature crops of the same type, on the same Y level, are harvested.
# Odd sizes center on the clicked block. Even sizes automatically select the
# square containing the clicked block with the most connected mature crops.
# Only orthogonally adjacent crops are harvested (not diagonal-only crops).
# Each harvested block consumes its own replanting item and durability attempt.
harvest-area-size: 1

# Feedback when crops are successfully harvested using a hoe.
harvest-effects:
  particles: true
  sound: true

# Poisonous potato quality-of-life features.
poisonous-potatoes:
  composting:
    enabled: true
    # Probability (0.0 to 1.0) of raising the composter one level per potato.
    chance: 0.65
    # Also applies to hopper-fed poisonous potatoes.
  brewing:
    # Use poisonous potatoes instead of spider eyes to brew Awkward -> Poison.
    # Uses one potato per brewing cycle (up to three bottles), standard blaze powder fuel
    # and a 400-tick (20-second) brewing duration.
    enabled: true

# Tree Feller (opt-in experimental module; disabled by default).
# All axe types in Survival mode; requires reapwright.treefeller.
# Wear is rolled once per removed LOG with Unbreaking (chance 1/(level+1));
# foliage/attachments do not consume axe durability. A harvest is refused
# if the pre-rolled wear would consume the final durability point.
# Mending uses vanilla XP-orb repair; automated felling does not grant repairs.
# Creaking Hearts: Silk Touch drops the Heart, otherwise resin clumps scale
# with Fortune. Naturally generated Hearts can grant experience.
# Bee Nests and Beehives: Silk Touch preserves the block, resident bees, and
# honey level; without Silk Touch, honeycomb drops and residents emerge angry.
# Nearby bees associated with the broken hive are angered in either case.
# WorldGuard and CoreProtect integration is optional and NOT runtime verified.
# Partial-harvest rollback is not yet implemented; back up test worlds.
tree-feller:
  enabled: false
  # UNVERIFIED optional integrations: opt in only after testing on a backup world.
  # SAFETY: If WorldGuard/CoreProtect is installed but its integration is disabled,
  # Tree Feller refuses automatic harvesting (it will NOT bypass protected regions
  # or make unlogged changes). Ordinary crop harvesting remains available.
  integrations:
    worldguard: false
    coreprotect: false
  auto-replant: true
  # When true, an eligible Silk Touch axe can replant the harvested tree for free.
  # One sapling is placed per verified planting position (four for a 2x2 tree).
  # This grants placement only: no saplings are added to drops or inventory.
  # Set false to require harvested saplings or inventory fallback as normal.
  # Has no effect when auto-replant is false; Nether fungi retain their own
  # free-replant behaviour regardless of this setting.
  free-silk-touch-replant: true
  break-leaves: true
  # Two delayed, bounded passes after felling (3s and another 5s later).
  # Repairs unsupported leaf distances and removes orphaned ordinary vines.
  # Only scans the felled tree region, not all loaded chunks.
  orphan-leaf-cleanup: true
  # Development diagnostics: one Mangrove island summary per successful scan.
  # Disable during normal play to avoid console noise.
  mangrove-debug: false
  # Detailed per-harvest chat diagnostics (counts, replant and special-block
  # summaries, incomplete-harvest codes). Disabled for normal gameplay.
  # Important warnings and axe-break acknowledgement are always displayed.
  debug-messages: false
  # Hide repeated identical Tree Feller notices for this many seconds per player.
  # Different warnings still appear; clickable axe-break offers are never suppressed.
  # 0 disables repeat suppression. Valid range: 0–60 seconds.
  message-repeat-cooldown-seconds: 10

  # Optional follow-on felling; original tree detection is always single-tree.
  domino:
    enabled: false
    max-additional-trees: 2

  # Each harvested natural leaf independently rolls for its planting item.
  # Percentages before Fortune; Fortune I/II/III use 1.25x / 1.667x / 2x.
  # Normal vanilla saplings: 5%; Jungle: Oak's 5% baseline.
  # Mangrove leaves do not normally drop propagules in vanilla; configured 1.0%.
  # Missing species entries revert to vanilla drops. Ordinary leaf loot is preserved.
  # Planted saplings consume generated drops first, then inventory fallback.
  # Set enabled: false to disable Reapwright's custom sapling rates.
  # Harvested leaves then use their original vanilla sapling drops
  # (including vanilla Fortune behaviour); rates below are ignored.
  sapling-drops:
    enabled: true
    rates:
      OAK: 5.0
      BIRCH: 5.0
      SPRUCE: 5.0
      JUNGLE: 5.0
      ACACIA: 5.0
      DARK_OAK: 5.0
      PALE_OAK: 5.0
      CHERRY: 5.0
      POPLAR: 5.0
      AZALEA: 5.0
      FLOWERING_AZALEA: 5.0
      MANGROVE: 1.0

  # Bonus loot: ONE independent percentage roll per item entry, per successfully felled tree.
  # Example: HONEYCOMB chance: 15.0 means a 15% chance to award honeycomb for that tree,
  # regardless of how many logs or leaves it contained. Each other entry rolls separately,
  # so multiple different rewards (or none) may be awarded on the same tree.
  # On success, the quantity is randomly selected between min and max (inclusive).
  # These are BONUS drops in addition to ordinary harvested blocks and sapling drops.
  # Bonus rolls require Diamond or Netherite axes; all Fortune levels are eligible.
  # Fortune increases the QUANTITY on a successful entry roll, not its chance.
  # Default scaling: Fortune 0 = 1.00x, I = 1.25x, II = 1.50x, III = 1.75x.
  # Fractional quantities are rounded randomly for fair averages. Setting 0.0
  # disables bonus-quantity scaling. Allowed values: 0.0 through 1.0.
  # Existing configs with eligible-tools.diamond-fortune-3 are still recognized
  # as a fallback if eligible-tools.diamond is absent (no Fortune III requirement).
  bonus-loot:
    enabled: true
    fortune-quantity-bonus-per-level: 0.25
    eligible-tools:
      diamond: true
      netherite: true
